<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电路实验室 · 简普</title>
<meta name="description" content="电路实验室：改进节点法（MNA）求解电路，实时计算各支路电流与节点电压，支持二极管与 LED 非线性元件。">
<meta name="theme-color" content="#fbf9f7">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="js/theme.js"></script>
<script src="js/canvas-theme.js"></script>
<link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
<script>window.addEventListener('error', function (e) {
  var h = document.getElementById('status');
  if (h) { h.textContent = '脚本错误：' + e.message + ' @' + (e.lineno || '?'); h.className = 'status warn'; }
});</script>
  <script src="js/shell.js"></script>
</head>
<body class="lab">
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar" role="banner" data-lab="电路实验室" data-en="Circuit Lab" data-glyph="电" data-tone="circuit">
  <div class="tools">
    <select id="preset" title="预置电路"></select>
    <button id="undo" class="btn" disabled>撤销</button>
    <button id="redo" class="btn" disabled>重做</button>
    <button id="export" class="btn">导出 JSON</button>
    <label class="btn">导入<input id="import" type="file" accept=".json" hidden></label>
    <button id="clear" class="btn ghost">清空</button>
  </div>
</header>

<main id="main" class="app">
  <aside class="panel" aria-label="参数与控制面板">
    <section class="block">
      <h3>工具</h3>
      <div class="add-grid">
        <button class="add" data-tool="select"><span class="ico" style="background:#e8879b;border-radius:50%;width:12px;height:12px"></span>选择</button>
        <button class="add" data-tool="wire"><span class="ico" style="background:#5a4a3f;width:16px;height:3px"></span>导线</button>
      </div>
    </section>

    <section class="block">
      <h3>放置元件</h3>
      <div class="add-grid">
        <button class="add" data-tool="battery"><span class="ico t-battery"></span>电源</button>
        <button class="add" data-tool="resistor"><span class="ico t-resistor"></span>电阻</button>
        <button class="add" data-tool="bulb"><span class="ico t-bulb"></span>小灯泡</button>
        <button class="add" data-tool="switch"><span class="ico t-switch"></span>开关</button>
        <button class="add" data-tool="diode"><span class="ico t-diode"></span>二极管</button>
        <button class="add" data-tool="led"><span class="ico t-led"></span>LED</button>
        <button class="add" data-tool="ammeter"><span class="ico t-ammeter"></span>电流表</button>
        <button class="add" data-tool="voltmeter"><span class="ico t-voltmeter"></span>电压表</button>
      </div>
    </section>

    <section class="block" id="props"></section>
  </aside>

  <section class="stage">
    <div class="stage-head">
      <span class="status" id="status">—</span>
      <div class="spacer"></div>
      <span class="hint">点击开关可直接通断 · R 旋转 · Delete 删除 · 导线双击或回车结束</span>
    </div>
    <div class="canvas-wrap circuit">
      <svg id="schem" role="img" aria-label="电路接线图" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>
</main>

<script src="js/circuit/core.js"></script>
<script src="js/circuit/app.js"></script>
</body>
</html>
