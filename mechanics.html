<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>力学实验室 · 简普</title>
<meta name="description" content="力学实验室：受力分析与矢量箭头标注，固定步长积分，静摩擦与滑动摩擦按 μs、μk 判据切换。">
<meta name="theme-color" content="#fbf9f7">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="js/theme.js"></script>
<script src="js/canvas-theme.js"></script>
<link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
<script>window.addEventListener('error', function (e) {
  var h = document.getElementById('hint');
  if (h) { h.textContent = '脚本错误：' + e.message + ' @' + (e.lineno || '?'); h.className = 'hint bad'; }
});</script>
  <script src="js/shell.js"></script>
</head>
<body class="lab">
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar" role="banner" data-lab="力学实验室" data-en="Mechanics Lab" data-glyph="力" data-tone="mechanics">
  <div class="tools">
    <select id="preset" title="场景预设"></select>
    <button id="play" class="btn">▶ 演示</button>
    <button id="step" class="btn">步进 0.1s</button>
    <button id="reset" class="btn">复位</button>
  </div>
</header>

<main id="main" class="app">
  <aside class="panel" aria-label="参数与控制面板">
    <section class="block">
      <h3>显示</h3>
      <label class="chk"><input type="checkbox" id="show_forces" checked>受力箭头</label>
      <label class="chk"><input type="checkbox" id="show_velocity" checked>速度箭头</label>
      <label class="chk"><input type="checkbox" id="show_trail" checked>运动轨迹</label>
      <label class="chk"><input type="checkbox" id="show_labels" checked>数值标签</label>
      <div class="row" style="margin-top:8px">
        <label>速度</label>
        <input id="speed" type="range" min="0.1" max="2" step="0.1" value="1">
        <span class="val" id="speedV">1.0×</span>
      </div>
      <div class="row"><label>力比例</label><span class="val" id="scaleV" style="flex:1;text-align:left">—</span></div>
    </section>

    <section class="block" id="props"></section>

    <section class="block">
      <h3>受力分析</h3>
      <p class="tip" id="note"></p>
    </section>

    <section class="block">
      <h3>模型说明</h3>
      <p class="tip">
        平动模型（si-translation-v1）：只算质心位移，不处理转动与物体间碰撞。<br>
        固定步长 1/240 s，半步法积分。<br>
        静止判据：|v|&lt;10⁻⁸ 且所需静摩擦 ≤ μsN。
      </p>
    </section>
  </aside>

  <section class="stage">
    <div class="stage-head">
      <span class="status" id="live">—</span>
      <span class="spacer"></span>
      <span class="stat">t <b id="tLabel">0.00 s</b></span>
      <span class="hint" id="hint">拖动物体改位置 · 滚轮缩放 · 空格播放</span>
    </div>
    <div class="canvas-wrap">
      <canvas id="scene" aria-label="可交互的物理演示画布"></canvas>
    </div>
  </section>
</main>

<script src="js/mech/core.js"></script>
<script src="js/mech/app.js"></script>
</body>
</html>
