    s.className = 'tag' + (st.field === f ? ' on' : '');
    s.textContent = f;
    s.onclick = function () { st.field = f; render(); };
    el.appendChild(s);
  });
}

function renderBookTabs() {
  var el = document.getElementById('bookTabs');
  el.innerHTML = '';
  BOOKS.forEach(function (b) {
    var d = document.createElement('div');
    d.className = 'booktab' + (st.book === b.id ? ' on' : '');
    d.innerHTML = b.title + '<span class="n">' + bookCount(b) + '</span>';
    d.onclick = function () { st.book = b.id; st.ch = null; st.sec = null; render(); };
    el.appendChild(d);
  });
}

function renderTree() {
  var b = BOOKS.filter(function (x) { return x.id === st.book; })[0];
  var el = document.getElementById('treeCh');
  el.innerHTML = '';
  /* 全部 */
  var all = document.createElement('div');
  all.className = 'ch open';
  all.innerHTML = '<div class="crow' + (st.ch === null ? ' ' : '') + '" style="' +
    (st.ch === null ? 'background:var(--accent);color:#fff' : '') + '"><span class="cn">全部</span>' +
    '<span class="cnt" style="' + (st.ch === null ? 'opacity:.8' : '') + '">' + bookCount(b) + '</span></div>';
  all.querySelector('.crow').onclick = function () { st.ch = null; st.sec = null; render(); };
  el.appendChild(all);
  /* 各章 */
  CHAPTERS.filter(function (c) { return c.n >= b.from && c.n <= b.to; }).forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'ch' + (st.ch === c.n ? ' open' : '');
    var crow = document.createElement('div');
    crow.className = 'crow';
    crow.innerHTML = '<span class="cn"><span class="arrow">▶</span>' + c.t + '</span><span class="cnt">' + chCount(c.n) + '</span>';
    crow.onclick = function () {
      if (st.ch === c.n) { st.ch = null; st.sec = null; }
      else { st.ch = c.n; st.sec = null; }
      render();
    };
    d.appendChild(crow);
    var secs = document.createElement('div');
    secs.className = 'secs';
    c.secs.forEach(function (s) {
      var sd = document.createElement('div');
      sd.className = 'sec' + (st.sec === s ? ' on' : '');
      sd.innerHTML = '<span>' + s + '</span><span class="n">' + (2 + (s.length % 3)) + '</span>';
      sd.onclick = function (e) {
        e.stopPropagation();
        if (st.sec === s) st.sec = null; else st.sec = s;
        if (!st.ch) st.ch = c.n;
        render();
      };
      secs.appendChild(sd);
    });
    d.appendChild(secs);
    el.appendChild(d);
  });
  document.getElementById('stageCnt').textContent = CARDS.length + ' 个资源';
}

function renderGrid() {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var list = CARDS.filter(function (c) {
    var b = BOOKS.filter(function (x) { return x.id === st.book; })[0];
    if (c.ch < b.from || c.ch > b.to) return false;
    if (st.ch !== null && c.ch !== st.ch) return false;
    if (st.sec && c.sec !== st.sec) return false;
    if (st.field !== '全部' && c.f !== st.field) return false;
    if (st.kw && c.t.indexOf(st.kw) < 0 && c.sec.indexOf(st.kw) < 0) return false;
    if (!st.kw && st.view === 'exercise' && c.kind !== 'exercise') return false;
    return true;
  });
  document.getElementById('cnt').textContent = list.length;
  document.getElementById('empty').style.display = list.length ? 'none' : '';
  /* 范围标题 */
  var t = '全部资源';
  if (st.sec) t = st.sec;
  else if (st.ch !== null) t = CHAPTERS.filter(function (c) { return c.n === st.ch; })[0].t;
  document.getElementById('rangeTitle').textContent = t;

  list.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'card';
    if (c.play) d.onclick = function () { location.href = c.play; };
    else d.onclick = function () { showCardInfo(c); };
    d.innerHTML =
      '<div class="thumb" style="background:' + c.bg + '">' + iconImg(c.ic, 62) +
      (c.play ? '<span class="ftag">免费试玩</span>' : '') + '</div>' +
      '<div class="cap"><div class="meta">' +
      '<span class="f1">' + c.f + '</span><span class="f2">' + (c.kind === 'exercise' ? '典型题目' : '经典知识') + '</span>' +
      '</div><div class="t">' + c.t + '</div><div class="d">' + c.d + '</div></div>';
    grid.appendChild(d);
  });
}

function render() {
  renderFieldTags();
  renderBookTabs();
  renderTree();
  renderGrid();
}

document.querySelectorAll('.viewrow .tag').forEach(function (el) {
  el.onclick = function () {
    document.querySelectorAll('.viewrow .tag').forEach(function (x) { x.classList.remove('on'); });
    el.classList.add('on');
    st.view = el.dataset.view;
    render();
  };
});
document.getElementById('go').onclick = function () { st.kw = document.getElementById('q').value.trim(); render(); };
document.getElementById('q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { st.kw = this.value.trim(); render(); }
});
(function () {
  var m = /[?&]q=([^&]*)/.exec(location.search);
  if (m) { st.kw = decodeURIComponent(m[1]); document.getElementById('q').value = st.kw; }
})();
/* ---------- 详情弹层：知识点正文（源: cn-math-taxonomy, CC BY-NC 4.0）+ 题目 + 推荐实验室 ---------- */
var LAB_LINK = { '力学': 'mechanics.html', '电学': 'circuit.html', '光学': 'optics.html', '热学': 'formula.html', '声学': 'formula.html' };
var LAB_NAME = { '力学': '力学实验室', '电学': '电路实验室', '光学': '光学实验室', '热学': '公式实验室', '声学': '公式实验室' };
/* 章节 n → 教材册前缀（源数据用 八上/八下/九全） */
function bookPrefix(n) { return n <= 6 ? '八上' : (n <= 12 ? '八下' : '九全'); }
var CN_NUM = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
function cnChapterNum(str) {
  var m = /第([一二三四五六七八九十]+)章/.exec(str || '');
  if (!m) return 0;
  var s = m[1];
  if (s === '十') return 10;
  if (/^十/.test(s)) return 10 + (CN_NUM[s[1]] || 0);
  if (/十$/.test(s)) return (CN_NUM[s[0]] || 0) * 10;
  if (s.indexOf('十') > 0) return (CN_NUM[s[0]] || 0) * 10 + (CN_NUM[s[2]] || 0);
  return CN_NUM[s] || 0;
}
/* 找到卡片所属章的知识点与题目 */
function chTopics(n) {
  if (!window.KB_TOPICS) return [];
  var pre = bookPrefix(n);
  return window.KB_TOPICS.filter(function (t) {
    return t.ch.indexOf(pre) === 0 && cnChapterNum(t.ch) === n;
  });
}
function chQuestions(n) {
  var ts = chTopics(n);
  if (!ts.length || !window.KB_QUESTIONS) return [];
  var ids = {};
  ts.forEach(function (t) { ids[t.id] = 1; });
  return window.KB_QUESTIONS.filter(function (q) { return ids[q.tid]; });
}
function showCardInfo(c) {
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(63,48,41,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--panel,#ffffff);border-radius:16px;max-width:620px;width:100%;max-height:84vh;overflow-y:auto;padding:26px 26px 22px;box-shadow:0 12px 40px rgba(40,25,15,.28);position:relative';
  var ch = CHAPTERS.filter(function (x) { return x.n === c.ch; })[0];
  var lab = LAB_LINK[c.f];
  var topics = chTopics(c.ch);
  var qs = chQuestions(c.ch);
  var isEx = c.kind === 'exercise';
  var html = '';

  /* 匹配到知识点：优先显示当前节，其次整章 */
  if (topics.length) {
    var secTopics = c.sec ? topics.filter(function (t) { return t.n === c.sec; }) : [];
    var show = secTopics.length ? secTopics : topics;
    html += '<div style="font-size:11px;letter-spacing:1px;color:var(--muted,#9a8f93);margin-bottom:6px">' +
      (ch ? ch.t + ' · 第 ' + c.ch + ' 章' : '') + (c.sec ? ' · ' + c.sec : '') +
      ' · ' + show.length + ' 个知识点</div>';
    html += '<h3 style="margin:0 0 12px;font-size:17px;color:var(--ink,#3b3335)">' + iconImg(c.ic, 24) + ' ' +
      (secTopics.length ? c.sec : (ch ? ch.t : c.t)) +
      (isEx ? ' · 随堂精练' : '') + '</h3>';
    if (!isEx) {
      show.forEach(function (t) {
        html += '<div style="border:1px solid #F0EAE2;border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#FDFBF7">' +
          '<div style="font-size:14.5px;font-weight:600;color:var(--ink,#3b3335)">' + t.n +
          '<span style="font-size:11px;font-weight:500;color:var(--muted,#9a8f93);margin-left:8px">' + t.ch + '</span></div>' +
          '<p style="margin:7px 0 0;font-size:13px;line-height:1.75;color:var(--ink-2,#6c6165)">' + t.d + '</p>' +
          (t.mc && t.mc.length ? '<div style="margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--muted,#9a8f93)"><b style="color:var(--green-text,#157F44)">掌握标准</b>：' +
            t.mc.map(function (m) { return '<span style="display:inline-block;background:#F2F7F2;border-radius:6px;padding:2px 8px;margin:3px 4px 0 0">' + m + '</span>'; }).join('') + '</div>' : '') +
          (t.dq ? '<div style="margin-top:9px;font-size:12.5px;color:var(--blue-deep,#3E63C8);cursor:pointer" class="dq" data-a="' + String(t.dq.a).replace(/"/g, '&quot;') + '">诊断题 · ' + t.dq.q + ' <span style="color:var(--muted,#9a8f93);font-size:11px">(点击看答案)</span></div>' : '') +
          '</div>';
      });
    } else {
      var pool = qs.filter(function (q) { return q.ty === 'choice'; }).slice(0, 8);
      html += '<div style="font-size:12px;color:var(--muted,#9a8f93);margin-bottom:10px">共 ' + qs.length + ' 道题，展示前 ' + pool.length + ' 道选择题 · <a href="quiz.html?subject=physics&grade=' + c.ch + '" style="color:var(--blue-deep,#3E63C8)">去随堂自测 →</a></div>';
      pool.forEach(function (q, i) {
        html += '<div style="border:1px solid #F0EAE2;border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#FDFBF7">' +
          '<div style="font-size:13.5px;font-weight:600;color:var(--ink,#3b3335)">' + (i + 1) + '. ' + q.p + '</div>' +
          ((q.ch || []).map(function (o) { return '<div style="font-size:12.5px;color:var(--ink-2,#6c6165);margin-top:3px">' + o.key + '. ' + o.text + '</div>'; }).join('')) +
          '<div style="margin-top:8px;font-size:12.5px;color:var(--green-text,#157F44);cursor:pointer" class="ans" data-a="答案 ' + q.a + ' · ' + String(q.ex || '').replace(/"/g, '&quot;') + '">点击看答案与解析</div>' +
          '</div>';
      });
    }
  } else {
    /* 未匹配到数据时的回落 */
    html += '<div style="font-size:11px;letter-spacing:1px;color:var(--muted,#9a8f93);margin-bottom:6px">' +
      (ch ? ch.t + ' · 第 ' + c.ch + ' 章' : '知识专题') + (c.sec ? ' · ' + c.sec : '') + '</div>' +
      '<h3 style="margin:0 0 8px;font-size:17px;color:var(--ink,#3b3335)">' + iconImg(c.ic, 24) + ' ' + c.t + '</h3>' +
      '<p style="margin:0 0 6px;font-size:13px;line-height:1.7;color:var(--ink-2,#6c6165)">' +
      (c.d === '点击查看详情'
        ? '本节「' + (c.sec || '') + '」的' + (isEx ? '典型题目讲解' : '考点知识精讲') + '。'
        : c.d) + '</p>' +
      '<p style="margin:0 0 16px;font-size:12px;color:var(--muted,#9a8f93)">学科：' + c.f + ' · 类型：' + (isEx ? '典型题目' : '经典知识') + '</p>';
  }
  if (lab) html += '<a href="' + lab + '" style="display:inline-block;background:var(--danger,#e8879b);color:#fff;text-decoration:none;border-radius:9px;padding:9px 18px;font-size:13px">去' + (LAB_NAME[c.f] || '实验室') + '动手做 →</a> ' +
    '<a href="quiz.html?subject=physics" style="display:inline-block;background:var(--blue-50,#EDF3FD);color:var(--blue-deep,#3E63C8);text-decoration:none;border-radius:9px;padding:9px 18px;font-size:13px;margin-left:6px">随堂自测 →</a>';
  html += '<div style="margin-top:14px;font-size:10.5px;color:var(--faint,#b3aca2)">知识点与题库来源：cn-math-taxonomy（CC BY-NC 4.0），对齐人教版 2022 年版课标</div>';
  html += '<button style="position:absolute;top:10px;right:12px;border:0;background:none;font-size:20px;color:var(--muted,#9a8f93);cursor:pointer" aria-label="关闭">×</button>';
  box.innerHTML = html;
  ov.appendChild(box);
  document.body.appendChild(ov);
  /* 诊断题 / 答案翻转 */
  box.addEventListener('click', function (e) {
    var t = e.target.closest('.dq, .ans');
    if (!t) return;
    if (t.dataset.open) { t.textContent = t.dataset.orig; delete t.dataset.open; }
    else { t.dataset.orig = t.innerHTML; t.textContent = t.dataset.a; t.dataset.open = '1'; }
  });
  function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.onclick = function (e) { if (e.target === ov) close(); };
  box.querySelector('button').onclick = close;
  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); }
  });
}
render();
</script>
</body>
</html>
