<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资源库 · 简普</title>
<meta name="description" content="资源库：按物理 / 化学 / 生物 / 数学 / 地理 / 工具 六类浏览全部资源，可交互项带免费试玩标签。">
<meta name="theme-color" content="#fbf9f7">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
<style>
  .lib { display: flex; min-height: 100vh; background: var(--paper-2); }
  .side { width: 88px; background: var(--panel); color: var(--muted); border-right: 1px solid var(--line); display: flex; flex-direction: column;
          align-items: stretch; padding: 14px 0; gap: 2px; position: sticky; top: 0; height: 100vh; }
  .side .brand { color: var(--ink); font-weight: 700; font-size: 14px; text-align: center; padding: 10px 0 16px;
                 display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .side .brand .logo { width: 34px; height: 34px; border-radius: 12px; background: var(--accent); color: #fff;
                       display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .side a, .side .sitem { display: flex; flex-direction: column; align-items: center; gap: 3px;
                          color: var(--side-muted); text-decoration: none; font-size: 12px; padding: 10px 4px; margin: 0 8px;
                          border-radius: 10px; cursor: pointer; }
  .side a:hover, .side .sitem:hover { background: var(--hover-2); color: var(--accent); }
  .side .ic { font-size: 17px; }
  .side .badge { position: absolute; }
  .main { flex: 1; padding: 22px 34px 60px; max-width: 1160px; }
  .cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 18px; }
  .cat { background: var(--panel); border-radius: 16px; text-align: center; padding: 26px 0; font-size: 17px;
         letter-spacing: 6px; color: var(--ink); text-decoration: none; box-shadow: var(--shadow-sm);
         border: 2px solid transparent; transition: transform .12s, border-color .12s; position: relative; overflow: hidden; }
  .cat:hover { transform: translateY(-2px); border-color: var(--line-2); }
  .cat.active { background: var(--hover-2); color: var(--accent); font-weight: 600; border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .cat.active::after { content: 'TOOLS'; position: absolute; right: 10px; bottom: 6px; font-size: 15px;
                       font-weight: 800; color: rgba(232,135,155,.18); letter-spacing: 2px; }
  .total { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .total b { color: var(--accent); }
  .searchrow { display: flex; justify-content: center; margin-bottom: 8px; }
  .search { display: flex; width: 560px; max-width: 100%; background: var(--panel); border-radius: 12px;
            box-shadow: var(--shadow-sm); overflow: hidden; }
  .search select { border: none; background: var(--paper-3); padding: 0 12px; color: var(--ink-2); font-size: 13px; outline: none; }
  .search input { flex: 1; border: none; outline: none; padding: 11px 14px; font-size: 13px; background: transparent; }
  .search button { border: none; background: var(--accent); color: #fff; padding: 0 26px; font-size: 14px; cursor: pointer; }
  .subhint { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  /* 资源 / 案例 视图切换 */
  .viewseg { display: inline-flex; background: var(--panel); border-radius: 999px; padding: 3px;
             box-shadow: var(--shadow-sm); margin-bottom: 16px; }
  .viewseg button { border: 0; background: transparent; padding: 6px 20px; border-radius: 999px;
                    font-size: 13.5px; color: var(--ink-2); cursor: pointer; font-family: inherit; }
  .viewseg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .viewseg .cnt { font-size: 11px; opacity: .85; margin-left: 4px; }
  /* 案例卡：题干可能较长，限三行 */
  .tool .d.caseq { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
                   line-height: 1.55; min-height: 4.6em; }
  .tool .cap .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tool .cap .meta span { font-size: 11px; padding: 2px 8px; border-radius: 999px;
                          background: var(--panel); color: var(--ink-2); border: 1px solid var(--line); }
  .empty-cases { text-align: center; color: var(--muted); padding: 40px 0 20px; font-size: 14px; }
  .empty-cases a { color: var(--accent); font-weight: 600; }
  .tool { background: var(--panel); border-radius: 14px; overflow: hidden; text-decoration: none; color: inherit;
          box-shadow: var(--shadow-sm); transition: transform .12s, box-shadow .12s; position: relative;
          display: block; }
  .tool:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .tool .thumb { height: 122px; display: flex; align-items: center; justify-content: center;
                 font-size: 56px; position: relative; overflow: hidden; }
  .tool:not(.locked) .thumb::before { content: ''; position: absolute; width: 150px; height: 150px; border-radius: 50%;
                 background: rgba(255,255,255,.38); top: -52px; right: -40px; }
  .tool:not(.locked) .thumb::after { content: ''; position: absolute; width: 92px; height: 92px; border-radius: 50%;
                 background: rgba(255,255,255,.30); bottom: -36px; left: -22px; }
  .tool .thumb > * { position: relative; z-index: 1; filter: drop-shadow(0 2px 4px rgba(60,40,30,.18)); }
  .tool .thumb .ftag { position: absolute; top: 9px; left: 9px; background: rgba(255,255,255,.92); color: #2f7a54; font-size: 10.5px;
                       padding: 2px 9px; border-radius: 999px; font-weight: 600; box-shadow: 0 1px 3px rgba(90,60,70,.12); }
  .tool .cap { padding: 10px 12px 12px; }
  .tool .cap .t { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap;
                  overflow: hidden; text-overflow: ellipsis; }
  .tool .cap .d { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .tool.locked .thumb::after { content: ''; position: absolute; inset: 0; background: var(--overlay); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  html[data-theme="dark"] .tool .thumb { filter: brightness(.72) saturate(.85); }
  html[data-theme="dark"] .tool .thumb .ftag { background: rgba(255,255,255,.82); }

  @media (max-width: 900px){
    .main { padding: 18px 16px 48px; min-width: 0; }
    .lib { min-width: 0; }
    .search { width: auto; max-width: 100%; }
    .search input { min-width: 0; }
    .cats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .cat { padding: 18px 0; font-size: 15px; letter-spacing: 3px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  }
  @media (max-width: 560px){
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tool .thumb { height: 96px; font-size: 32px; }
    .tool .cap .t { font-size: 13px; }
    .search button { padding: 0 16px; font-size: 13px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div id="site-nav"></div>
<script src="js/site-nav.js"></script>
<script src="js/cases-data.js"></script>
<div class="lib">
  <main id="main" class="main">
    <nav class="cats" id="cats"></nav>

    <div class="viewseg" id="viewseg"></div>

    <div class="total">当前直连可玩资源 <b id="total">0</b> 个 · 每个学科页可切换「资源 / 案例」（共 69 道互动案例）· 按年级找题见 <a href="quiz.html" style="color:var(--accent);font-weight:600">随堂自测</a></div>

    <div class="searchrow">
      <div class="search">
        <select><option>资源库搜索</option></select>
        <input id="q" placeholder="输入工具名称或关键词…">
        <button id="go">搜索</button>
      </div>
    </div>
    <div class="subhint">搜索时跨全部分类；带绿色「免费试玩」标签的卡片点开即用。</div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的资源，换个关键词试试</div>
  </main>
</div>

<script>
/* ---------- 数据：学科门户 + 6 个可玩实验室 + 课堂工具直连卡 ----------
   去重说明：学科入口只保留「随堂自测」页（quiz.html），
   开源互动案例统一收进本页各学科分类的「案例」视图（数据在 js/cases-data.js）。 */
var CATS = ['物理', '化学', '生物', '数学', '地理', '工具'];

var TOOLS = [
  /* 学科门户：各科可视化互动学习入口（门户内按年级/章节收纳全部案例，含 AI 生成参考案例） */
  { t: '物理 · 可视化互动学习', d: '初二～高三 · 41 个演示：伽利略 / 凸透镜 / 平衡木 / 3D 实验课', c: '物理', ic: '🧲', bg: 'linear-gradient(135deg,#d5e6f0,#b4cde0)', play: 'ai-cases/physicslearn/index.html' },
  { t: '数学 · 可视化互动学习', d: '初一～高三 · 18 模块 + 拓展题：四面体 / 圆柱 / 圆锥', c: '数学', ic: '📐', bg: 'linear-gradient(135deg,#d5e7e8,#b4d6da)', play: 'ai-cases/mathlearn/index.html' },
  { t: '化学 · 可视化互动学习', d: '初三～高二 · 分子与晶体 · 3D 结构断网可转', c: '化学', ic: '⚗️', bg: 'linear-gradient(135deg,#e5d2e7,#d5b4da)', play: 'ai-cases/chemistrylearn/index.html' },
  { t: '生物 · 可视化互动学习', d: '初一～初二 · 细胞与遗传可视化', c: '生物', ic: '🔬', bg: 'linear-gradient(135deg,#d7e8d5,#b9dab4)', play: 'ai-cases/biologylearn/index.html' },
  { t: '地理 · 可视化互动学习', d: '初一 · 等高线与气候判读可视化', c: '地理', ic: '🗺️', bg: 'linear-gradient(135deg,#e0e8d5,#c9dab4)', play: 'ai-cases/geographylearn/index.html' },

  /* 免费试玩：6 间可交互实验室 */
  { t: '地形实验室', d: '等高线 · 剖面 · 3D 立体图', c: '地理', ic: '🏔️', bg: 'linear-gradient(135deg,#dee8d5,#c1dab4)', play: 'terrain.html' },
  { t: '电路实验室', d: 'MNA 求解器 · 实时电流读数', c: '物理', ic: '🔌', bg: 'linear-gradient(135deg,#d5dfe8,#b4c7da)', play: 'circuit.html' },
  { t: '力学实验室', d: '受力分析 · 斜面 · 摩擦判据', c: '物理', ic: '🧱', bg: 'linear-gradient(135deg,#e8ded5,#dac7b4)', play: 'mechanics.html' },
  { t: '分子实验室', d: '球棍/空间填充 · 键角演示', c: '化学', ic: '⚗️', bg: 'linear-gradient(135deg,#e5d2e7,#d5b4da)', play: 'molecule.html' },
  { t: '数理公式实验室', d: '迷你 TeX · 31 条关系参数联动', c: '数学', ic: '🧮', bg: 'linear-gradient(135deg,#e8d5d9,#dab4bd)', play: 'formula.html' },
  { t: '光学实验室', d: '薄透镜成像 · 光线求像', c: '物理', ic: '🪞', bg: 'linear-gradient(135deg,#deede8,#b7dab4)', play: 'optics.html' },

  /* 课堂工具箱：12 件工具全部已实现（classroom.html 单页 + 深链） */
  { t: '课堂随机点名', d: '一轮不重复 · 名单可编辑', c: '工具', ic: '🎲', bg: 'linear-gradient(135deg,#d1d8e6,#b4beda)', play: 'classroom.html#rollcall' },
  { t: '分组挑战·知识抢答', d: '键盘抢答 · 计分计时', c: '工具', ic: '🏆', bg: 'linear-gradient(135deg,#e6ded1,#daccb4)', play: 'classroom.html#quiz-buzzer' },
  { t: '背诵小组 PK', d: '轮流背诵 · 裁判判分', c: '工具', ic: '📋', bg: 'linear-gradient(135deg,#d8e6d1,#c3dab4)', play: 'classroom.html#recite-pk' },
  { t: '闪记 PK', d: '双人同屏抢答', c: '工具', ic: '⚡', bg: 'linear-gradient(135deg,#ded1e6,#ccb4da)', play: 'classroom.html#flashcard-pk' },
  { t: '宣言滚动屏', d: '班级宣言投屏滚动', c: '工具', ic: '🌌', bg: 'linear-gradient(135deg,#d1d8e6,#b3c0db)', play: 'classroom.html#marquee' },
  { t: '课程生活华小鱼', d: '番茄钟 · 任务打卡', c: '工具', ic: '🐟', bg: 'linear-gradient(135deg,#d1e6de,#b4ceda)', play: 'classroom.html#huaxiaoyu' },
  { t: '单词速记卡', d: '艾宾浩斯复习节奏', c: '工具', ic: '🃏', bg: 'linear-gradient(135deg,#e6d8d1,#dac3b4)', play: 'classroom.html#words' },
  { t: '喊麦读单词', d: '节奏鼓点 · 单词齐读开麦', c: '工具', ic: '🎤', bg: 'linear-gradient(135deg,#d6d1e6,#c3b4da)', play: 'classroom.html#rap-en' },
  { t: '喊麦读词语', d: '生字成语 · 全班节奏齐读', c: '工具', ic: '📢', bg: 'linear-gradient(135deg,#e6d1d9,#dab4c8)', play: 'classroom.html#rap-cn' },
  { t: '随堂小测', d: '50 题题库 · 错题导出', c: '工具', ic: '✏️', bg: 'linear-gradient(135deg,#d1e6e6,#b4dada)', play: 'classroom.html#quiz' },

  /* 学科直连工具 */
  { t: '细胞结构解剖图', d: '动植物细胞热区讲解', c: '生物', ic: '🔬', bg: 'linear-gradient(135deg,#dee6d1,#cedab4)', play: 'classroom.html#cell' },
  { t: '遗传概率演练', d: '庞纳特方格自动推演', c: '生物', ic: '🧬', bg: 'linear-gradient(135deg,#d1e6d8,#b4ceda)', play: 'classroom.html#genetics' },
  { t: '化学方程式配平', d: '自动配平与检查', c: '化学', ic: '⚖️', bg: 'linear-gradient(135deg,#e6d1d1,#dab4b4)', play: 'classroom.html#balance' },
  { t: '等高线地形判读', d: '山脊山谷实时演练', c: '地理', ic: '🗺️', bg: 'linear-gradient(135deg,#e6ded1,#dacbb4)', play: 'terrain.html' },
  { t: '气候类型判读', d: '气温降水图判读训练', c: '地理', ic: '🌦️', bg: 'linear-gradient(135deg,#d1dfe6,#b4cada)', play: 'classroom.html#climate' }
];

/* ---------- 渲染 ---------- */
var active = '物理';   /* 默认落在「物理」页（物理 3 间实验室置顶） */
var kw = '';
var view = 'res';      /* 当前视图：res=资源 / case=案例（仅学科分类下可切） */

/* 案例原始分类 → 学科页分类 */
var CASE_SUBJECT = { '物理': '物理', '电路与逻辑': '物理', '数学': '数学', '函数与代数': '数学', '立体几何': '数学' };
/* 无独立案例的学科：案例视图引导到门户 */
var PORTAL_OF = { '化学': '化学 · 可视化互动学习', '生物': '生物 · 可视化互动学习', '地理': '地理 · 可视化互动学习' };
var SUBJ_META = { '物理': { ic: '🧲', bg: 'linear-gradient(135deg,#d5e6f0,#b4cde0)' },
                  '数学': { ic: '📐', bg: 'linear-gradient(135deg,#d5e7e8,#b4d6da)' },
                  '化学': { ic: '⚗️', bg: 'linear-gradient(135deg,#e5d2e7,#d5b4da)' },
                  '生物': { ic: '🔬', bg: 'linear-gradient(135deg,#d7e8d5,#b9dab4)' },
                  '地理': { ic: '🗺️', bg: 'linear-gradient(135deg,#e0e8d5,#c9dab4)' } };

function casesOf(subject) {
  return (window.CASES || []).filter(function (x) { return CASE_SUBJECT[x.c] === subject; });
}

function renderViewSeg() {
  var host = document.getElementById('viewseg');
  var isSubject = active !== '工具';
  host.style.display = isSubject ? '' : 'none';
  if (!isSubject) return;
  host.innerHTML = '';
  [['res', '资源', TOOLS.filter(function (x) { return x.c === active; }).length],
   ['case', '案例', casesOf(active).length]].forEach(function (v) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = v[0] === view ? 'on' : '';
    b.innerHTML = v[1] + '<span class="cnt">' + v[2] + '</span>';
    b.onclick = function () { view = v[0]; render(); };
    host.appendChild(b);
  });
}

function renderCats() {
  var el = document.getElementById('cats');
  el.innerHTML = '';
  CATS.forEach(function (c) {
    var a = document.createElement('a');
    a.className = 'cat' + (c === active ? ' active' : '');
    a.textContent = c;
    a.href = 'javascript:';
    a.onclick = function () { active = c; view = 'res'; render(); };
    el.appendChild(a);
  });
}

function renderCaseGrid(grid) {
  var list = kw ? (window.CASES || []).filter(function (x) {
        return x.n.indexOf(kw) >= 0 || x.q.indexOf(kw) >= 0; })
      : casesOf(active);
  document.getElementById('empty').style.display = list.length ? 'none' : '';
  list.forEach(function (x) {
    var m = SUBJ_META[CASE_SUBJECT[x.c]] || SUBJ_META['物理'];
    var a = document.createElement('a');
    a.className = 'tool';
    a.href = 'ai-cases/' + encodeURI(x.p);
    a.innerHTML =
      '<div class="thumb" style="background:' + m.bg + '">' + m.ic +
      '<span class="ftag">免费试玩</span></div>' +
      '<div class="cap"><div class="t">' + x.n + '</div>' +
      '<div class="d caseq">' + x.q + '</div>' +
      '<div class="meta"><span>' + x.s + '</span>' +
      (x.tech || []).map(function (t) { return '<span>' + t + '</span>'; }).join('') +
      (x.off ? '<span>' + (x.offTxt || '部分在线') + '</span>' : '') +
      '</div></div>';
    grid.appendChild(a);
  });
}

function renderEmptyCases(grid) {
  var portal = PORTAL_OF[active];
  var d = document.createElement('div');
  d.className = 'empty-cases';
  d.innerHTML = portal
    ? '「' + active + '」的章节互动案例收在学科门户里：<a href="' +
      TOOLS.filter(function (x) { return x.t === portal; })[0].play + '">打开' + portal + ' →</a>'
    : '该学科暂无独立案例，先看「资源」视图。';
  grid.appendChild(d);
  document.getElementById('empty').style.display = 'none';
}

function render() {
  renderCats();
  renderViewSeg();
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (view === 'case' && active !== '工具') {
    if (casesOf(active).length || kw) renderCaseGrid(grid);
    else renderEmptyCases(grid);
    return;
  }
  var list = TOOLS.filter(function (x) {
    return (!kw || x.t.indexOf(kw) >= 0 || x.d.indexOf(kw) >= 0) && (!kw || true);
  });
  /* 搜索时跨全部分类；未搜索时按当前分类 */
  if (!kw) list = list.filter(function (x) { return x.c === active; });
  document.getElementById('empty').style.display = list.length ? 'none' : '';
  list.forEach(function (x) {
    var a = document.createElement(x.play ? 'a' : 'div');
    a.className = 'tool' + (x.play ? '' : ' locked');
    if (x.play) a.href = x.play;
    else a.onclick = function () { alert('该工具即将上线：' + x.t + '\n\n同学科内容已映射到可交互实验室与学科门户（带绿色「免费试玩」标签的卡片）。'); };
    a.innerHTML =
      '<div class="thumb" style="background:' + x.bg + '">' + x.ic +
      (x.play ? '<span class="ftag">免费试玩</span>' : '') + '</div>' +
      '<div class="cap"><div class="t">' + x.t + '</div><div class="d">' + x.d + '</div></div>';
    grid.appendChild(a);
  });
}

document.getElementById('total').textContent = TOOLS.length;   /* 真实卡片数，不再虚标 */
document.getElementById('go').onclick = function () { kw = document.getElementById('q').value.trim(); render(); };
document.getElementById('q').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { kw = this.value.trim(); render(); }
});
/* 支持 ?q=关键词 直达搜索（跨全部分类）；?cat=物理 直达学科页与视图 */
(function () {
  var m = /[?&]q=([^&]*)/.exec(location.search);
  if (m) {
    kw = decodeURIComponent(m[1]);
    document.getElementById('q').value = kw;
  }
  var c = /[?&]cat=([^&]*)/.exec(location.search);
  if (c) {
    var cat = decodeURIComponent(c[1]);
    if (CATS.indexOf(cat) >= 0) active = cat;
  }
  var v = /[?&]view=([^&]*)/.exec(location.search);
  if (v && decodeURIComponent(v[1]) === 'case') view = 'case';
})();
render();
</script>
</body>
</html>
